# Stage 3: live-pipeline evaluation with a virtual camera. Held-out INCLUDE
# test videos are played into Chromium as its webcam and recognised through
# the real Live Recognition page, in-browser MediaPipe, the API and the
# released model. Manual: push run/include-live-eval (settings in
# ml/runs/include-live-eval.json). Raw videos stay on the runner.
name: INCLUDE live-pipeline evaluation

on:
  workflow_dispatch:
  push:
    branches: ["run/include-live-eval"]

permissions:
  contents: read

env:
  PYTHONPATH: backend:ml
  HAND_MODEL_URL: https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task
  POSE_MODEL_URL: https://storage.googleapis.com/mediapipe-models/pose_landmarker/pose_landmarker_lite/float16/1/pose_landmarker_lite.task

jobs:
  live-eval:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.13", cache: pip, cache-dependency-path: backend/requirements.txt }
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libgl1 ffmpeg
      - run: pip install -r backend/requirements.txt
      - id: cfg
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          c = json.load(open("ml/runs/include-live-eval.json"))
          print("parts=" + c["parts"]); print("model_tag=" + c["model_tag"]); print("limit=" + str(c.get("limit", 0)))
          PY
      - name: Install the released model
        run: python scripts/fetch_model.py --tag "${{ steps.cfg.outputs.model_tag }}" --registry models --promote
      - name: MediaPipe models (server-side offline comparison)
        run: curl -fsSL -o hand.task "$HAND_MODEL_URL" && curl -fsSL -o pose.task "$POSE_MODEL_URL"
      - name: Prepare held-out test videos (Y4M) + offline predictions
        run: |
          python -m isl_nova_ml.include_pipeline fetch-test-videos --parts "${{ steps.cfg.outputs.parts }}" \
            --out videos --work "$RUNNER_TEMP/work" --registry models --hand-model hand.task --pose-model pose.task \
            --limit "${{ steps.cfg.outputs.limit }}"
      - name: Build frontend
        working-directory: frontend
        run: npm install --no-audit --no-fund && npm run build && npx playwright install --with-deps chromium
      - name: Start ISL NOVA with the model
        run: |
          (cd backend && DATABASE_URL=sqlite:///$RUNNER_TEMP/db.sqlite STORAGE_DIR=$RUNNER_TEMP/obj MODEL_REGISTRY_DIR=$GITHUB_WORKSPACE/models \
            JWT_SECRET=$(openssl rand -hex 32) RATE_LIMIT_PER_MINUTE=100000 PYTHONPATH=$GITHUB_WORKSPACE/backend:$GITHUB_WORKSPACE/ml \
            nohup python -m uvicorn app.main:app --port 8000 > $RUNNER_TEMP/server.log 2>&1 &)
          for i in $(seq 1 60); do curl -fsS localhost:8000/api/v1/model/info | grep -q '"available": *true' && break; sleep 2; done
          curl -fsS localhost:8000/api/v1/model/info | head -c 300
      - name: Virtual-camera live evaluation
        working-directory: frontend
        run: node tests/live-eval/live_eval.mjs http://127.0.0.1:8000 ../videos ../live_eval.json
      - name: Summary
        if: always()
        run: |
          { echo "## Live-pipeline evaluation (virtual camera, held-out INCLUDE test videos, NOT a live person)"; echo '```json';
            python -c "import json;print(json.dumps(json.load(open('live_eval.json'))['summary'],indent=2))"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: live-eval-report, path: "live_eval.json\nvideos/videos.json", retention-days: 90 }
