name: Complete-run script (Windows)

# Runs scripts/complete_windows.ps1 as a user would, on a small real slice of INCLUDE (Colours):
# install -> (tests skipped: covered by windows-local.yml) -> face-model training on the slice ->
# promotion -> summary; then checks that a reinstall keeps the newly trained model active.
on:
  workflow_dispatch:
  push:
    branches: ["run/complete-check"]

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.13" }
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - name: First install (creates .venv)
        run: .\scripts\setup_windows.ps1 -Python python -WithMediaPipeTasks
      - name: Small real face dataset (Colours, 2 parts)
        run: .venv\Scripts\python scripts\include_local.py --only Colours --workers 2
      - name: complete_windows.ps1 (no tests, dataset already there, one face model)
        run: .\scripts\complete_windows.ps1 -SkipTests -SkipDataset -Model bilstm-attn-face
      - name: Check the trained model is active, the log exists, and a reinstall keeps it
        shell: pwsh
        run: |
          $reg = Get-Content artifacts\models\registry.json -Raw | ConvertFrom-Json
          "active after training: $($reg.active)"
          if ($reg.active -like 'bilstm_attn-20261110*') { throw "the trained model was not promoted" }
          if (-not (Get-ChildItem logs\complete-*.log)) { throw "no log written" }
          Get-Content (Get-ChildItem logs\complete-*.log | Select-Object -Last 1) -Tail 15
          .\scripts\setup_windows.ps1 -Python python -SkipFrontend
          $after = (Get-Content artifacts\models\registry.json -Raw | ConvertFrom-Json).active
          "active after reinstall: $after"
          if ($after -ne $reg.active) { throw "reinstall replaced the trained model" }
      - name: password_windows.ps1 changes the password in the app's database
        shell: pwsh
        run: |
          .\scripts\password_windows.ps1
          $admin = ((Get-Content .env | Select-String '^BOOTSTRAP_ADMIN_EMAIL=') -split '=', 2)[1].Trim()
          $env:ISL_NOVA_NEW_PASSWORD = 'changed-in-ci-123'
          .\scripts\password_windows.ps1 -Email $admin
          if ($LASTEXITCODE -ne 0) { throw "set-password failed" }
          Remove-Item Env:ISL_NOVA_NEW_PASSWORD
          $p = Start-Process powershell -ArgumentList '-NoProfile','-ExecutionPolicy','Bypass','-File','scripts\start_windows.ps1','-Port','8011' -PassThru
          for ($i = 0; $i -lt 60; $i++) { try { Invoke-RestMethod http://127.0.0.1:8011/api/v1/health | Out-Null; break } catch { Start-Sleep 2 } }
          $ok = Invoke-WebRequest -UseBasicParsing -Method Post -ContentType 'application/json' -Uri http://127.0.0.1:8011/api/v1/auth/login -Body (@{ email = $admin; password = 'changed-in-ci-123' } | ConvertTo-Json) -SkipHttpErrorCheck
          "login with new password: $($ok.StatusCode)"
          if ($ok.StatusCode -ne 200) { throw "new password rejected" }
          Get-CimInstance Win32_Process | Where-Object { $_.CommandLine -match 'uvicorn' } | ForEach-Object { Stop-Process -Id $_.ProcessId -Force }
