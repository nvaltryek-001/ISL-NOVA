# Publishes a GitHub release when a version tag (v*) is pushed. Notes come from
# docs/releases/<tag>.md. Model weights stay on their own model-* releases.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Create the release
        env: { GH_TOKEN: "${{ secrets.GITHUB_TOKEN }}" }
        run: |
          notes="docs/releases/${GITHUB_REF_NAME}.md"
          test -f "$notes" || { echo "missing $notes"; exit 1; }
          gh release create "$GITHUB_REF_NAME" --title "ISL NOVA $GITHUB_REF_NAME" --notes-file "$notes" --verify-tag
