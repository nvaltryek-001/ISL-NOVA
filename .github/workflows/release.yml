# Publishes a GitHub release (and its tag) for a version. Notes come from
# docs/releases/<version>.md. Start from the Actions tab (Run workflow) or by
# pushing a v* tag. Model weights stay on their own model-* releases.
name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version tag to create, e.g. v2.0.0"
        required: true
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Create the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ inputs.version || github.ref_name }}
        run: |
          notes="docs/releases/${VERSION}.md"
          test -f "$notes" || { echo "missing $notes"; exit 1; }
          if gh release view "$VERSION" >/dev/null 2>&1; then echo "release $VERSION exists"; exit 0; fi
          gh release create "$VERSION" --target "$GITHUB_SHA" --title "ISL NOVA $VERSION" --notes-file "$notes" --latest
