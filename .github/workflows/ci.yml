name: CI

on:
  push:
    branches: [main, "feat/**"]
  pull_request:

permissions:
  contents: read

jobs:
  python:
    name: Python (lint + tests on SQLite and PostgreSQL)
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: islnova_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libgl1
      - run: pip install -r backend/requirements-dev.txt
      - name: Ruff
        run: ruff check backend ml dataset/scripts scripts
      - name: Vocabulary is reproducible
        run: python dataset/scripts/build_vocabulary.py && python dataset/scripts/draft_translations.py && git diff --exit-code -- dataset/vocabulary ':!dataset/vocabulary/verification_log.csv'
      - name: Tests (SQLite)
        run: pytest -q
      - name: Tests (PostgreSQL)
        env:
          TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/islnova_test
        run: pytest -q backend/tests
      - name: Synthetic pipeline smoke test (NOT ISL results)
        run: PYTHONPATH=ml python -m isl_nova_ml.smoke --out /tmp/smoke --epochs 6

  frontend:
    name: Frontend (typecheck, unit, build, E2E)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libgl1
      - run: pip install -r backend/requirements-dev.txt
      - working-directory: frontend
        run: npm install --no-audit --no-fund
      - working-directory: frontend
        run: npm run typecheck
      - working-directory: frontend
        run: npm test
      - working-directory: frontend
        run: npm run build
      - working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Sign references for the Practice Coach / Text-to-Sign E2E
        run: python scripts/fetch_references.py
      - working-directory: frontend
        env:
          E2E_MODEL_TAG: model-lstm-20261104T041414Z-s13
          AXE_REQUIRED: "1"
        run: npm run e2e

  audit:
    name: Dependency audit (report only)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.13" }
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - name: pip-audit (backend/requirements.txt)
        continue-on-error: true
        run: pip install pip-audit==2.9.0 && pip-audit -r backend/requirements.txt --progress-spinner off
      - name: npm audit (production dependencies)
        continue-on-error: true
        working-directory: frontend
        run: npm install --no-fund --package-lock-only && npm audit --omit=dev

  docker:
    name: Docker image
    runs-on: ubuntu-24.04
    needs: [python, frontend]
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t isl-nova:ci .
      - name: Container starts and reports health
        run: |
          docker run -d --name nova -p 8000:8000 -e JWT_SECRET=$(openssl rand -hex 32) \
            -e DATABASE_URL=sqlite:////data/ci.db isl-nova:ci
          for i in $(seq 1 40); do curl -fsS http://127.0.0.1:8000/api/v1/health && exit 0; sleep 2; done
          docker logs nova; exit 1
