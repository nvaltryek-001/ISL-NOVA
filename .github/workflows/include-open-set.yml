# Stage 4: unknown-sign (open-set) evaluation. The released 200-class model is
# scored on the INCLUDE official test split (known) and on INCLUDE glosses
# outside the vocabulary (reserve, never trained on). Manual: push
# run/include-open-set (settings in ml/runs/include-open-set.json).
name: INCLUDE open-set evaluation

on:
  workflow_dispatch:
  push:
    branches: ["run/include-open-set"]

permissions:
  contents: write   # attach the report to the model's pre-release
  actions: read     # download the landmark artifact from the data run

env:
  PYTHONPATH: backend:ml

jobs:
  open-set:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.13", cache: pip, cache-dependency-path: backend/requirements.txt }
      - run: pip install -r backend/requirements.txt
      - id: cfg
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          c = json.load(open("ml/runs/include-open-set.json"))
          for k in ("data_run_id", "artifact", "model_tag"): print(f"{k}={c[k]}")
          print("attach=" + str(c.get("attach_to_release", False)).lower())
          PY
      - uses: actions/download-artifact@v4
        with:
          name: ${{ steps.cfg.outputs.artifact }}
          path: data
          run-id: ${{ steps.cfg.outputs.data_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Install the released model
        run: python scripts/fetch_model.py --tag "${{ steps.cfg.outputs.model_tag }}" --registry models --promote
      - name: Known (test split) vs unknown (reserve glosses)
        run: |
          python -m isl_nova_ml.include_pipeline open-set --registry models --manifest data/manifest.json \
            --data-root data --out report
          python3 -c "import json; print(json.dumps(json.load(open('report/open_set.json')), indent=1))"
      - uses: actions/upload-artifact@v4
        with: { name: open-set-report, path: report, retention-days: 90 }
      - name: Attach report to the model pre-release
        if: steps.cfg.outputs.attach == 'true'
        env: { GH_TOKEN: "${{ secrets.GITHUB_TOKEN }}" }
        run: gh release upload "${{ steps.cfg.outputs.model_tag }}" report/open_set.json report/open_set_rows.csv --clobber -R "$GITHUB_REPOSITORY"
